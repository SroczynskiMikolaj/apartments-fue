<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Restores the real URL after 404.html bounced a deep link (e.g.
         /Sightseeing) through "/?/Sightseeing". Must run before the app
         bundle so React Router sees the correct path. See 404.html. -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-5D6KW98B");
    </script>
    <!-- End Google Tag Manager -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f4a47" />

    <!-- Typography: Fraunces (editorial serif display) + Inter (body).
         preconnect first so the font request starts before the CSS parses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600&display=swap"
    />

    <title>
      Colores de Fuerteventura — Apartments in Costa Calma, Fuerteventura
    </title>
    <meta
      name="description"
      content="Two bright holiday apartments in Costa Calma, Fuerteventura. Shared pool, free parking, 4 guests, a short walk from the beach. Sun all year round."
    />
    <link rel="canonical" href="https://fuerteventuracostacalma.eu/" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Colores de Fuerteventura" />
    <meta
      property="og:title"
      content="Colores de Fuerteventura — Apartments in Costa Calma"
    />
    <meta
      property="og:description"
      content="Two bright holiday apartments in Costa Calma, Fuerteventura. Shared pool, free parking, 4 guests, a short walk from the beach."
    />
    <meta property="og:url" content="https://fuerteventuracostacalma.eu/" />
    <meta
      property="og:image"
      content="https://fuerteventuracostacalma.eu/og-image.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Structured data: lets Google show the apartments as a lodging
         result rather than a generic page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LodgingBusiness",
        "name": "Colores de Fuerteventura",
        "url": "https://fuerteventuracostacalma.eu/",
        "description": "Two holiday apartments in Costa Calma, Fuerteventura, with a shared pool and free parking.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Costa Calma",
          "addressRegion": "Fuerteventura",
          "addressCountry": "ES"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 28.170936,
          "longitude": -14.221792
        },
        "telephone": "+34697308989",
        "email": "coloresdefuerteventure@gmail.com",
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Shared swimming pool", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Free parking", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Wi-Fi", "value": true }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-5D6KW98B"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
        title="Google Tag Manager"
      ></iframe
    ></noscript>

    <div id="root"></div>
  </body>
</html>
